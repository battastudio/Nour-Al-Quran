name = "nour-push"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

# Every minute: recompute each subscriber's due notifications and push them.
[triggers]
crons = ["* * * * *"]

# KV store for subscriptions. Create it once and paste the id here:
#   wrangler kv namespace create SUBS
[[kv_namespaces]]
binding = "SUBS"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Lock CORS to your Pages origin (or leave "*" while testing).
ALLOW_ORIGIN = "https://battastudio.github.io"

# Secrets (do NOT put here) — set with `wrangler secret put`:
#   VAPID_PUBLIC   (base64url, from `npx web-push generate-vapid-keys`)
#   VAPID_PRIVATE  (base64url private key)
#   VAPID_SUBJECT  (e.g. "mailto:you@example.com")
